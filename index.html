<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepCut // AI Video Compliance Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for progress bars */
        .progress-transition {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6 font-sans">

    <div class="w-full max-w-4xl mx-auto space-y-8 mt-10">
        
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                DeepCut Engine
            </h1>
            <p class="text-slate-400 max-w-md mx-auto text-sm">
                Automated video timeline auditing for continuity, copyright compliance, and visual consistency.
            </p>
        </header>

        <main class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            
            <div id="uploadZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-8 text-center cursor-pointer bg-slate-950/40 transition-colors">
                <input type="file" id="fileInput" class="hidden" accept=".xml,.edl,.mp4" />
                <div class="space-y-3">
