<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepCut // AI Video Compliance Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Smooth transitions for progress bars */
        .progress-transition {
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6 font-sans">

    <div class="w-full max-w-4xl mx-auto space-y-8 mt-10">
        
        <header class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent">
                DeepCut Engine
            </h1>
            <p class="text-slate-400 max-w-md mx-auto text-sm">
                Automated video timeline auditing for continuity, copyright compliance, and visual consistency.
            </p>
        </header>

        <main class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl relative overflow-hidden">
            
            <label for="fileInput" id="uploadZone" class="block border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-8 text-center cursor-pointer bg-slate-950/40 transition-colors">
                <input type="file" id="fileInput" class="hidden" accept=".xml,.edl,.mp4" />
                <div class="space-y-3 pointer-events-none">
                    <div class="text-4xl">📁</div>
                    <div class="text-slate-200 font-medium text-base">Click to select or drag timeline file</div>
                    <div class="text-slate-500 text-xs font-mono">Supports FCPXML, EDL, or video files</div>
                </div>
            </label>

            <div id="fileMetaRow" class="hidden flex items-center justify-between bg-slate-950 p-4 rounded-xl border border-slate-800 mt-4">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📄</span>
                    <div>
                        <p id="selectedFileName" class="font-mono text-sm font-medium text-slate-200">timeline.xml</p>
                        <p id="selectedFileSize" class="text-xs text-slate-500">0.0 KB</p>
                    </div>
                </div>
                <button id="runAuditBtn" class="bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-medium px-5 py-2 rounded-lg text-sm transition-all shadow-lg shadow-indigo-600/20">
                    Run Smart Audit
                </button>
            </div>

            <div id="progressContainer" class="hidden mt-6 space-y-6 bg-slate-950 p-6 rounded-xl border border-slate-800">
                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-mono">
                        <span id="scanText" class="text-orange-400 font-medium">Pending structural safety check...</span>
                        <span id="scanPercent" class="text-slate-500">0%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2.5 border border-slate-800 overflow-hidden">
                        <div id="scanBar" class="bg-orange-500 h-full w-0 progress-transition shadow-[0_0_10px_rgba(249,115,22,0.3)]"></div>
                    </div>
                </div>
                
                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-mono">
                        <span id="detectText" class="text-slate-500">Waiting for compliance engine...</span>
                        <span id="detectPercent" class="text-slate-500">0%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-2.5 border border-slate-800 overflow-hidden">
                        <div id="detectBar" class="bg-blue-500 h-full
